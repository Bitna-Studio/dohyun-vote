<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>최도현 응원 투표</title>

<style>
body {
    margin:0;
    font-family:"Noto Sans KR", sans-serif;
    background:#eef8ff;
    text-align:center;
}

.container {
    max-width:480px;
    margin:auto;
    padding:20px;
}

.title {
    font-size:28px;
    font-weight:bold;
    color:#0057b8;
    margin:20px 0;
}

img {
    width:100%;
    border-radius:20px;
}

.number-box {
    background:#fff4c2;
    border:4px solid #ffcc00;
    border-radius:20px;
    padding:20px;
    margin:20px 0;
}

.number-title {
    font-size:20px;
    font-weight:bold;
    color:#d35400;
}

.number {
    font-size:50px;
    font-weight:bold;
    color:#e60012;
    margin-top:10px;
}

.notice {
    background:white;
    border-radius:20px;
    padding:20px;
    font-size:18px;
    line-height:1.6;
}

.call {
    display:block;
    margin-top:25px;
    padding:20px;
    background:#0066cc;
    color:white;
    font-size:26px;
    font-weight:bold;
    border-radius:30px;
    text-decoration:none;
}

.small {
    font-size:15px;
    color:#555;
    margin-top:15px;
}
</style>

</head>

<body>

<div class="container">

<div class="title">
💙 광양이 키운 12세 트롯 꿈나무 💙
</div>

<img src="dohyun.jpg">

<!-- 방송 직전 수정하는 부분 -->
<div class="number-box">

<div class="number-title">
⭐ 최도현 투표 번호 ⭐
</div>

<div class="number">
👉 ○번
</div>

</div>


<div class="notice">

📞 전화 연결 후<br>
<strong>
위 투표 번호를 눌러주세요!
</strong>

</div>


<a class="call" href="tel:15801">
📞 전화로 바로 응원하기
</a>


<div class="small">
15801 연결 후 안내에 따라 참여해주세요 💙
</div>


</div>

</body>
</html>
